name: PR Codex Review

# OpenAI Codex CLI as a third-party reviewer for vendor diversity.
# Runs on risk:sensitive AND risk:blocked PRs (per .github/risk-paths.yml).
# Pairs with Claude Review (every PR via pr-review.yml) for independent-model
# coverage on high-impact code paths.
#
# Why blocked is included: blocked-path PRs (workflows, Dockerfile, secrets,
# CODEOWNERS, risk-paths.yml) require manual merge by design — auto-merge is
# refused by claude-author-automerge.yml. Without this widening, those PRs
# would ship with ZERO automated second-model review. Codex runs alongside
# so the manual merge is informed, not blind.
#
# The embedded classify job below ONLY computes the risk_class output
# (skip_label: true) — the standalone PR Classify workflow owns the risk:*
# label and the blocked-PR sticky comment, so the two never race. The job id
# `codex-classify` is deliberately distinct from the standalone caller's
# `classify`: `classify / Classify PR Risk` is a required status check in
# some repos' rulesets, and a same-named context from this workflow pollutes
# its evaluation (bit us on 2026-06-10 when a GitHub 401 incident reddened
# the duplicate while the required one stayed green).
#
# Output propagation: the reusable writes risk_class to GITHUB_OUTPUT in its
# compute step, so `needs.codex-classify.outputs.risk_class` is available
# even if a later classify step fails. `!cancelled()` overrides the default
# needs-skip-on-upstream-failure behavior while still bailing on workflow
# cancellation.

# ready_for_review is required in the type list: every draft-phase run
# (opened, synchronize) skips on the draft gate below, so without it a PR
# opened as draft and later marked ready never gets Codex review — the
# ready click fires no run, and only an incidental post-ready push would.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

# The group key partitions runs by the payload's draft flag, not just
# per-PR. A `synchronize` run whose payload was snapshotted while the PR
# was still draft is a guaranteed no-op (the draft gate below), yet in a
# shared group it can cancel — or, if queued, replace regardless of
# cancel-in-progress — the ready_for_review run, so a sensitive/blocked
# PR taken draft → ready would still merge with zero Codex review (same
# race as pr-classify.yml, attaxion_dev#303, 2026-07-06).
# Quarantining draft-payload runs in their own group fixes that while
# non-draft runs keep today's supersede semantics: a newer push still
# cancels an in-flight stale run before it can review pre-push state.
concurrency:
  group: codex-${{ github.event.pull_request.number }}-${{ github.event.pull_request.draft && 'draft' || 'live' }}
  cancel-in-progress: true

jobs:
  codex-classify:
    if: github.event.pull_request.draft == false
    uses: topcoder1/ci-workflows/.github/workflows/pr-classify.yml@main
    with:
      skip_label: true

  review:
    needs: codex-classify
    if: |
      !cancelled() &&
      (needs.codex-classify.outputs.risk_class == 'sensitive' ||
       needs.codex-classify.outputs.risk_class == 'blocked')
    uses: topcoder1/ci-workflows/.github/workflows/codex-review.yml@main
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

  # risk:standard — the class that was reaching main with no second-model read.
  # `standard` is the FALLBACK for any path matching no rule in risk-paths.yml
  # AND the class claude-author-automerge.yml will auto-merge, so it was the
  # largest body of unreviewed code. Precedent: whois-api-llc/wxa_vpn#1270
  # (+839 lines under src/**) and #1273 (+786) were both `standard`, both
  # passed CI clean, and a manual Codex run on #1270 afterwards found four
  # P1s including a forgeable-identity security hole.
  #
  # THE JOB ID IS A SECURITY BOUNDARY — do NOT fold this into `review`.
  # The published check is "<job id> / Codex Review", and
  # claude-author-automerge.yml's `codex_check_name` (default
  # "review / Codex Review", not overridden in this repo) names the check
  # whose SUCCESS bypasses the risk-tier manual-merge gate. That bypass
  # trusts a CONCLUSION, not a review: when codex-gate.mjs skips (diff under
  # its size threshold, or docs/tests-only) the review steps skip but the job
  # still concludes `success`. Routing `standard` through `review` would let a
  # SMALL change to an auth/billing/migration path — classified `standard`
  # because it is not in this repo's `sensitive:` list, yet flagged risky=1 by
  # the central regex — auto-merge with Codex having read nothing.
  # `review_standard` matches no codex_check_name: coverage, no new bypass.
  #
  # ADVISORY, not a merge gate: not in any required-checks ruleset, so a
  # standard PR can merge before this finishes. Spend is bounded by
  # codex-gate.mjs (small-diff and docs/tests-only skips).
  review_standard:
    needs: codex-classify
    if: |
      !cancelled() &&
      needs.codex-classify.outputs.risk_class == 'standard'
    uses: topcoder1/ci-workflows/.github/workflows/codex-review.yml@main
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
